<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440" fill="none">
  <defs>
    <radialGradient id="creamCore" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f3d98b"/>
      <stop offset="55%" stop-color="#faecc0"/>
      <stop offset="100%" stop-color="#fef9e7"/>
    </radialGradient>
    <radialGradient id="mauvePetal" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8c5cd"/>
      <stop offset="65%" stop-color="#b97b8a"/>
      <stop offset="100%" stop-color="#8d505f"/>
    </radialGradient>
    <radialGradient id="blueBlossom" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="55%" stop-color="#8bb4dc"/>
      <stop offset="100%" stop-color="#5b88b8"/>
    </radialGradient>
    <linearGradient id="sageLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd8cf"/>
      <stop offset="100%" stop-color="#859c8e"/>
    </linearGradient>
    <linearGradient id="oliveLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b9c7a8"/>
      <stop offset="100%" stop-color="#7c8f6b"/>
    </linearGradient>
  </defs>

  <!-- Stems -->
  <g stroke="#8c9e7e" stroke-linecap="round" opacity="0.82">
    <path d="M202 385 C208 300, 238 210, 315 62" stroke-width="3.2"/>
    <path d="M196 382 C178 290, 152 195, 134 102" stroke-width="2.4"/>
    <path d="M210 386 C235 320, 285 270, 354 240" stroke-width="2.4"/>
    <path d="M188 378 C150 320, 96 270, 56 226" stroke-width="2.4"/>
  </g>

  <!-- Sage Eucalyptus & Olive Leaves (Back Layer) -->
  <g opacity="0.88">
    <ellipse cx="92" cy="142" rx="18" ry="22" transform="rotate(-18 92 142)" fill="url(#sageLeaf)"/>
    <ellipse cx="106" cy="178" rx="19" ry="23" transform="rotate(14 106 178)" fill="url(#sageLeaf)"/>
    <ellipse cx="122" cy="204" rx="22" ry="17" transform="rotate(-12 122 204)" fill="url(#sageLeaf)"/>
    <path d="M98 228 C68 222, 46 212, 30 206 C48 224, 72 238, 98 242 Z" fill="url(#oliveLeaf)"/>
    <path d="M112 248 C78 250, 52 246, 36 244 C56 260, 84 268, 112 262 Z" fill="url(#sageLeaf)"/>
    <ellipse cx="154" cy="336" rx="18" ry="20" transform="rotate(-22 154 336)" fill="url(#sageLeaf)"/>
    <ellipse cx="144" cy="368" rx="17" ry="18" transform="rotate(15 144 368)" fill="url(#sageLeaf)"/>
    <ellipse cx="182" cy="358" rx="16" ry="19" transform="rotate(-8 182 358)" fill="url(#sageLeaf)"/>
    <path d="M266 250 C296 228, 326 206, 344 196 C326 222, 298 244, 272 260 Z" fill="url(#oliveLeaf)"/>
    <path d="M244 342 C258 364, 274 388, 286 404 C264 392, 248 370, 236 348 Z" fill="url(#oliveLeaf)"/>
  </g>

  <!-- Tall Soft Blue Delphinium Spike (Upper Right) -->
  <g>
    <!-- Top buds -->
    <circle cx="322" cy="46" r="8" fill="#dbeafe" opacity="0.9"/>
    <circle cx="308" cy="64" r="9" fill="#bfdbfe" opacity="0.92"/>
    <circle cx="332" cy="74" r="8" fill="#93c5fd" opacity="0.9"/>
    <!-- Blossom 1 -->
    <g transform="translate(292, 92)">
      <circle cx="0" cy="-12" r="10" fill="url(#blueBlossom)"/>
      <circle cx="12" cy="-3" r="10" fill="url(#blueBlossom)"/>
      <circle cx="8" cy="10" r="10" fill="url(#blueBlossom)"/>
      <circle cx="-8" cy="10" r="10" fill="url(#blueBlossom)"/>
      <circle cx="-12" cy="-3" r="10" fill="url(#blueBlossom)"/>
      <circle cx="0" cy="0" r="5" fill="#fef9c3"/>
    </g>
    <!-- Blossom 2 -->
    <g transform="translate(274, 134)">
      <circle cx="0" cy="-13" r="11" fill="url(#blueBlossom)"/>
      <circle cx="13" cy="-4" r="11" fill="url(#blueBlossom)"/>
      <circle cx="9" cy="11" r="11" fill="url(#blueBlossom)"/>
      <circle cx="-9" cy="11" r="11" fill="url(#blueBlossom)"/>
      <circle cx="-13" cy="-4" r="11" fill="url(#blueBlossom)"/>
      <circle cx="0" cy="0" r="5.5" fill="#fef9c3"/>
    </g>
    <!-- Blossom 3 -->
    <g transform="translate(306, 146)">
      <circle cx="0" cy="-12" r="10" fill="url(#blueBlossom)"/>
      <circle cx="12" cy="-3" r="10" fill="url(#blueBlossom)"/>
      <circle cx="8" cy="10" r="10" fill="url(#blueBlossom)"/>
      <circle cx="-8" cy="10" r="10" fill="url(#blueBlossom)"/>
      <circle cx="-12" cy="-3" r="10" fill="url(#blueBlossom)"/>
      <circle cx="0" cy="0" r="5" fill="#fef9c3"/>
    </g>
    <!-- Blossom 4 -->
    <g transform="translate(276, 178)">
      <circle cx="0" cy="-13" r="11" fill="url(#blueBlossom)"/>
      <circle cx="13" cy="-4" r="11" fill="url(#blueBlossom)"/>
      <circle cx="9" cy="11" r="11" fill="url(#blueBlossom)"/>
      <circle cx="-9" cy="11" r="11" fill="url(#blueBlossom)"/>
      <circle cx="-13" cy="-4" r="11" fill="url(#blueBlossom)"/>
      <circle cx="0" cy="0" r="5" fill="#fef9c3"/>
    </g>
    <!-- Blossom 5 -->
    <g transform="translate(242, 210)">
      <circle cx="0" cy="-12" r="10" fill="url(#blueBlossom)"/>
      <circle cx="12" cy="-3" r="10" fill="url(#blueBlossom)"/>
      <circle cx="8" cy="10" r="10" fill="url(#blueBlossom)"/>
      <circle cx="-8" cy="10" r="10" fill="url(#blueBlossom)"/>
      <circle cx="-12" cy="-3" r="10" fill="url(#blueBlossom)"/>
      <circle cx="0" cy="0" r="4.8" fill="#fef9c3"/>
    </g>
  </g>

  <!-- Baby's Breath Sprigs (Upper Left & Lower Left) -->
  <g fill="#fdf2f0" stroke="#e9d5d0" stroke-width="0.6">
    <circle cx="136" cy="86" r="4.5"/><circle cx="148" cy="96" r="4"/><circle cx="128" cy="104" r="4.5"/>
    <circle cx="158" cy="114" r="4.2"/><circle cx="142" cy="124" r="4.5"/><circle cx="168" cy="132" r="4"/>
    <circle cx="184" cy="112" r="4"/><circle cx="196" cy="126" r="4.5"/><circle cx="212" cy="120" r="4"/>
    <circle cx="110" cy="316" r="4.5"/><circle cx="122" cy="332" r="4"/><circle cx="96" cy="338" r="4.5"/>
    <circle cx="112" cy="356" r="4.5"/><circle cx="130" cy="348" r="4"/>
    <circle cx="334" cy="168" r="4"/><circle cx="352" cy="158" r="4.5"/><circle cx="364" cy="172" r="4"/>
  </g>

  <!-- Dusty Mauve Hellebore 1 (Upper Center) -->
  <g transform="translate(218, 172)">
    <ellipse cx="-18" cy="-14" rx="18" ry="15" transform="rotate(-25 -18 -14)" fill="url(#mauvePetal)" opacity="0.9"/>
    <ellipse cx="16" cy="-16" rx="18" ry="15" transform="rotate(25 16 -16)" fill="url(#mauvePetal)" opacity="0.88"/>
    <ellipse cx="22" cy="8" rx="17" ry="15" transform="rotate(60 22 8)" fill="url(#mauvePetal)" opacity="0.92"/>
    <ellipse cx="-20" cy="10" rx="17" ry="15" transform="rotate(-60 -20 10)" fill="url(#mauvePetal)" opacity="0.9"/>
    <ellipse cx="0" cy="20" rx="18" ry="14" fill="url(#mauvePetal)" opacity="0.94"/>
    <circle cx="0" cy="0" r="11" fill="#7c6f3e"/>
    <circle cx="0" cy="0" r="8" fill="#d9ce8c" stroke="#574d27" stroke-width="1.2" stroke-dasharray="2 2"/>
  </g>

  <!-- Large Creamy Butter-Yellow Ranunculus (Main Focal Left) -->
  <g transform="translate(156, 254)">
    <circle cx="0" cy="0" r="56" fill="url(#creamCore)" opacity="0.95"/>
    <path d="M-48 -14 C-56 -44, -10 -62, 22 -48 C52 -34, 58 14, 38 40 C16 62, -38 56, -48 20 Z" fill="#fef3c7" opacity="0.72"/>
    <path d="M-38 -10 C-42 -34, -8 -48, 18 -36 C42 -24, 44 12, 26 30 C8 46, -28 40, -38 12 Z" fill="#fde68a" opacity="0.65"/>
    <path d="M-26 -8 C-28 -24, -4 -34, 14 -24 C30 -14, 30 8, 16 20 C2 32, -20 26, -26 8 Z" fill="#f7d788" opacity="0.7"/>
    <path d="M-14 -4 C-14 -16, 4 -20, 12 -10 C18 -2, 14 12, 2 14 C-10 16, -16 6, -14 -4 Z" fill="#e5ba62" opacity="0.82"/>
    <circle cx="-4" cy="-2" r="5" fill="#b8913a" opacity="0.75"/>
  </g>

  <!-- Dusty Mauve Hellebore 2 (Lower Right) -->
  <g transform="translate(254, 294)">
    <ellipse cx="-24" cy="-18" rx="24" ry="20" transform="rotate(-25 -24 -18)" fill="url(#mauvePetal)" opacity="0.9"/>
    <ellipse cx="22" cy="-20" rx="24" ry="20" transform="rotate(25 22 -20)" fill="url(#mauvePetal)" opacity="0.88"/>
    <ellipse cx="28" cy="12" rx="23" ry="19" transform="rotate(62 28 12)" fill="url(#mauvePetal)" opacity="0.92"/>
    <ellipse cx="-26" cy="14" rx="23" ry="19" transform="rotate(-62 -26 14)" fill="url(#mauvePetal)" opacity="0.9"/>
    <ellipse cx="0" cy="26" rx="24" ry="19" fill="url(#mauvePetal)" opacity="0.95"/>
    <circle cx="0" cy="0" r="14" fill="#6b5e34"/>
    <circle cx="0" cy="0" r="10.5" fill="#e4da9a" stroke="#4f4522" stroke-width="1.4" stroke-dasharray="2.4 2.4"/>
  </g>

  <!-- Mauve Bud (Far Right) -->
  <g transform="translate(324, 264) rotate(28)">
    <ellipse cx="0" cy="0" rx="18" ry="14" fill="url(#mauvePetal)" opacity="0.92"/>
    <path d="M-16 0 C-8 -10, 8 -10, 16 0 C8 10, -8 10, -16 0 Z" fill="#8d505f" opacity="0.6"/>
  </g>
</svg>
