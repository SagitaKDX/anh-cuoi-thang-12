<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" fill="none">
  <defs>
    <linearGradient id="stemGold" x1="0" y1="0" x2="260" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="rosePetal" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="roseSoft" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="55%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="leafGold" x1="0" y1="0" x2="60" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Main Curved Branch & Stems -->
  <path d="M12 166 C56 138, 108 106, 178 68 C206 52, 230 38, 248 24" stroke="url(#stemGold)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M84 122 C74 96, 68 72, 62 48" stroke="url(#stemGold)" stroke-width="2" stroke-linecap="round"/>
  <path d="M138 92 C156 106, 176 118, 198 124" stroke="url(#stemGold)" stroke-width="2" stroke-linecap="round"/>
  <path d="M174 70 C170 48, 174 32, 184 18" stroke="url(#stemGold)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Leaves -->
  <path d="M52 138 C32 126, 24 110, 34 98 C48 106, 56 122, 52 138 Z" fill="url(#leafGold)" opacity="0.85"/>
  <path d="M104 114 C118 128, 134 134, 146 122 C134 108, 118 106, 104 114 Z" fill="url(#leafGold)" opacity="0.78"/>
  <path d="M150 82 C134 66, 132 48, 144 40 C156 52, 158 68, 150 82 Z" fill="url(#leafGold)" opacity="0.82"/>
  <path d="M206 54 C218 68, 234 72, 244 62 C234 50, 218 48, 206 54 Z" fill="url(#leafGold)" opacity="0.78"/>

  <!-- Rose 1 (Large Main Blossom) -->
  <g transform="translate(116, 86)">
    <circle cx="0" cy="0" r="24" fill="url(#rosePetal)"/>
    <path d="M-18 -6 C-22 -22, 4 -28, 14 -14 C24 -2, 18 20, 0 22 C-14 24, -22 10, -18 -6 Z" fill="url(#roseSoft)" opacity="0.92"/>
    <path d="M-12 -4 C-12 -16, 8 -18, 12 -6 C16 6, 4 16, -6 12 C-14 8, -14 0, -12 -4 Z" fill="#be123c"/>
    <path d="M-6 -2 C-6 -10, 6 -10, 8 -2 C10 6, -2 10, -6 4 Z" fill="#fda4af" opacity="0.9"/>
    <circle cx="0" cy="0" r="4" fill="#881337"/>
  </g>

  <!-- Rose 2 (Upper Left Blossom) -->
  <g transform="translate(62, 48)">
    <circle cx="0" cy="0" r="18" fill="url(#rosePetal)"/>
    <path d="M-14 -4 C-16 -16, 4 -20, 11 -10 C18 0, 12 16, -2 16 C-12 16, -16 6, -14 -4 Z" fill="url(#roseSoft)" opacity="0.9"/>
    <path d="M-7 -2 C-6 -10, 8 -10, 8 -1 C8 8, -4 10, -7 2 Z" fill="#9f1239"/>
    <circle cx="0" cy="-1" r="3.2" fill="#fecdd3"/>
  </g>

  <!-- Rose 3 (Lower Right Blossom) -->
  <g transform="translate(200, 122)">
    <circle cx="0" cy="0" r="17" fill="url(#rosePetal)"/>
    <path d="M-13 -4 C-14 -16, 6 -18, 12 -8 C16 2, 10 14, -2 15 C-12 15, -14 4, -13 -4 Z" fill="url(#roseSoft)" opacity="0.9"/>
    <path d="M-6 -2 C-5 -9, 7 -9, 7 -1 C7 7, -4 8, -6 2 Z" fill="#9f1239"/>
    <circle cx="0" cy="0" r="3" fill="#fde68a"/>
  </g>

  <!-- Rose 4 (Tip Blossom) -->
  <g transform="translate(240, 28)">
    <circle cx="0" cy="0" r="12" fill="url(#roseSoft)"/>
    <path d="M-7 -2 C-6 -9, 6 -9, 8 -1 C9 7, -2 9, -7 2 Z" fill="#be123c"/>
    <circle cx="0" cy="0" r="2.5" fill="#fde68a"/>
  </g>

  <!-- Rose Bud (Top) -->
  <g transform="translate(184, 18)">
    <path d="M-6 8 C-8 -4, 0 -12, 6 -10 C10 -4, 8 8, -6 8 Z" fill="url(#rosePetal)"/>
    <path d="M-3 6 C-4 -2, 2 -8, 5 -6 C7 -1, 4 6, -3 6 Z" fill="#fda4af"/>
  </g>
</svg>
